# 豆语星球 — 本地开发/测试环境
# ============================================================
# 启动全部服务:
#   docker compose up -d
#
# 查看日志:
#   docker compose logs -f server
#   docker compose logs -f frontend
#
# 停止:
#   docker compose down
#
# 重新构建后端:
#   docker compose build server
#
# 运行单元测试:
#   docker compose run --rm test
#
# 运行 E2E 测试:
#   docker compose run --rm e2e
# ============================================================

services:
  # ============================================================
  # PostgreSQL 数据库
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: magic-english-db
    environment:
      POSTGRES_DB: magic_english
      POSTGRES_USER: magic
      POSTGRES_PASSWORD: magic_dev_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U magic -d magic_english"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ============================================================
  # 数据库初始化（一次性）
  # ============================================================
  db-init:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: magic-english-db-init
    environment:
      DATABASE_URL: postgres://magic:magic_dev_2026@postgres:5432/magic_english
    volumes:
      - ./server/src:/app/src:ro
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        echo "⏳ Waiting for PostgreSQL to be ready..."
        until pg_isready -h postgres -U magic -d magic_english; do sleep 1; done
        echo "📦 Running drizzle-kit push..."
        npx drizzle-kit push --config drizzle.config.ts
        echo "🌱 Running seed..."
        npx tsx src/db/seeds/seed.ts
        echo "✅ DB init complete!"

  # ============================================================
  # 后端 API 服务
  # ============================================================
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: magic-english-api
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://magic:magic_dev_2026@postgres:5432/magic_english
      JWT_SECRET: dev-jwt-secret-magic-english-2026-local-only
      PORT: "3000"
      CORS_ORIGINS: http://localhost:5173,http://localhost:4173,http://frontend:5173
    ports:
      - "3000:3000"
    volumes:
      - ./server/src:/app/src:ro
    depends_on:
      db-init:
        condition: service_completed_successfully
    command: ["node", "--watch", "--import", "tsx", "src/main.ts"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================================
  # 前端开发服务器
  # ============================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: magic-english-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:3000/api
      VITE_WS_URL: ws://localhost:3000/ws
      VITE_APP_NAME: 豆语星球
      VITE_APP_VERSION: 1.0.0
    ports:
      - "5173:5173"
    volumes:
      - ./src:/app/src:ro
      - ./public:/app/public:ro
      - ./index.html:/app/index.html:ro
      - ./vite.config.ts:/app/vite.config.ts:ro
    depends_on:
      - server
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    restart: unless-stopped

  # ============================================================
  # 单元测试（前后端一起跑）
  # ============================================================
  test:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: magic-english-test
    environment:
      DATABASE_URL: postgres://magic:magic_dev_2026@postgres:5432/magic_english
      JWT_SECRET: test-secret
    volumes:
      - ./server/src:/app/src:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npm", "run", "test"]
    profiles:
      - test

  # ============================================================
  # E2E 测试
  # ============================================================
  e2e:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: magic-english-e2e
    environment:
      E2E_BASE_URL: http://server:3000/api/v1
    volumes:
      - ./e2e:/app/e2e:ro
      - ./vitest.e2e.config.ts:/app/vitest.e2e.config.ts:ro
    depends_on:
      server:
        condition: service_healthy
    command: ["npx", "vitest", "run", "--config", "vitest.e2e.config.ts"]
    profiles:
      - e2e

volumes:
  pgdata:
    driver: local
